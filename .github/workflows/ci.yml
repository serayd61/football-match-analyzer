name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # model.py / store.py saf stdlib; testler fastapi gerektirmez.
      - run: python -m unittest discover tests -v

  e2e:
    # 2026-11-16: ubuntu-latest = 26.04; Playwright 1.56 "does not support chromium on
    # ubuntu26.04" → browser kurulumunda düşüyor (main dahil). PR #247 Playwright'ı
    # 1.65'e yükseltiyor; o merge olunca bu sabitleme ubuntu-latest'e dönebilir.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # ubuntu-latest = Ubuntu 26.04; Playwright >= 1.61 gerekir (1.56 ile "does not support chromium on ubuntu26.04").
      - run: npx playwright install --with-deps chromium
      # Yalnız @static testler (secret yok, sahte DB adresi). @data için: npm run e2e:prod
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
